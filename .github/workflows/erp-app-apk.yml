name: ERP App APK

# Builds a release APK of the KrishiDukan ERP Flutter app
# (KARANARJUNKSKPVTLTD/krishidukan_erp_app, com.krishidukan.erp).
#
# Run it by hand: GitHub -> Actions -> "ERP App APK" -> Run workflow.
# It also runs when the app's code changes on main.
# Download the APK from the finished run's "Artifacts" section.

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Which app to build (see KARANARJUNKSKPVTLTD/krishidukan_erp_app/brands/README.md)"
        type: choice
        default: karanarjun
        options:
          - karanarjun
          - agrimass
  push:
    branches: [ main ]
    paths:
      - "KARANARJUNKSKPVTLTD/krishidukan_erp_app/**"
      - ".github/workflows/erp-app-apk.yml"

concurrency:
  group: erp-app-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # A push to main always builds the KaranArjun app.
      BRAND: ${{ inputs.brand || 'karanarjun' }}
    defaults:
      run:
        working-directory: KARANARJUNKSKPVTLTD/krishidukan_erp_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The app needs Dart >= 3.12 (pdf / printing packages), so use current
      # stable rather than pinning an older Flutter.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version the team builds with. Unpinned "stable" picked up
          # Flutter 3.50 on 12 Nov 2026, which deprecates package:flutter/material.dart
          # and failed every build on 43 "deprecated" notes. Bump on purpose, together
          # with the code, after testing locally.
          flutter-version: 3.47.9
          cache: true

      # Optional repo secrets (Settings -> Secrets and variables -> Actions):
      #   ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      # With them the APK is signed with your real release key, so users can
      # update over an earlier install. Without them a throwaway key is
      # generated: it installs fine, but a later build signed with a different
      # key cannot update it (the user would have to uninstall first).
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "Using release keystore from secrets"
            echo "$KS_B64" | base64 -d > android/upload.jks
            ALIAS="$KEY_ALIAS"; SP="$KS_PASS"; KP="$KEY_PASS"
          else
            echo "No keystore secrets -> generating a throwaway key"
            ALIAS=erpapp; SP=erpapp123; KP=erpapp123
            keytool -genkeypair -v -keystore android/upload.jks -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$SP" -keypass "$KP" -dname "CN=KrishiDukan ERP"
          fi
          # build.gradle.kts resolves storeFile against the android/ folder.
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$SP"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KP"
          } > android/key.properties

      - run: flutter pub get

      # White-label builds: same code, the client's name and icon. The default
      # (karanarjun) skips this step, so that build is unchanged.
      - name: Apply brand
        if: env.BRAND != 'karanarjun'
        run: |
          NAME=$(python3 -c "import json;print(json.load(open('brands/$BRAND/brand.json'))['BRAND_NAME'])")
          echo "Branding the app as: $NAME"
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$NAME</string>|" android/app/src/main/res/values/strings.xml
          grep app_name android/app/src/main/res/values/strings.xml
          dart run flutter_launcher_icons -f "brands/$BRAND/launcher_icons.yaml"

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build APK
        run: |
          if [ "$BRAND" = "karanarjun" ]; then
            flutter build apk --release
          else
            flutter build apk --release --dart-define-from-file="brands/$BRAND/brand.json"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BRAND == 'karanarjun' && 'krishidukan-erp-apk' || format('{0}-erp-apk', env.BRAND) }}
          path: KARANARJUNKSKPVTLTD/krishidukan_erp_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
