name: ERP App APK

# Builds an Android APK for testing or an app bundle for Google Play.
#
# Run it by hand: GitHub -> Actions -> "ERP App APK" -> Run workflow.
# It also runs when the app's code changes on main.
# Download the selected file from the finished run's "Artifacts" section.

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Which app to build (see KARANARJUNKSKPVTLTD/krishidukan_erp_app/brands/README.md)"
        type: choice
        default: karanarjun
        options:
          - karanarjun
          - agrimass
      artifact:
        description: "APK for testing or AAB for Google Play"
        type: choice
        default: apk
        options:
          - apk
          - aab
  push:
    branches: [ main ]
    paths:
      - "KARANARJUNKSKPVTLTD/krishidukan_erp_app/**"
      - ".github/workflows/erp-app-apk.yml"

concurrency:
  group: erp-app-apk-${{ github.ref }}-${{ inputs.brand || 'karanarjun' }}-${{ inputs.artifact || 'apk' }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # A push to main always builds the KaranArjun app.
      BRAND: ${{ inputs.brand || 'karanarjun' }}
      ARTIFACT: ${{ inputs.artifact || 'apk' }}
      SIGNING_PREFIX: ${{ inputs.brand == 'agrimass' && 'AGRIMASS_' || '' }}
    defaults:
      run:
        working-directory: KARANARJUNKSKPVTLTD/krishidukan_erp_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The app needs Dart >= 3.12 (pdf / printing packages), so use current
      # stable rather than pinning an older Flutter.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version the team builds with. Unpinned "stable" picked up
          # Flutter 3.50 on 12 Nov 2026, which deprecates package:flutter/material.dart
          # and failed every build on 43 "deprecated" notes. Bump on purpose, together
          # with the code, after testing locally.
          flutter-version: 3.47.9
          cache: true

      # Agrimass uses its own upload key. Play bundles require all signing
      # secrets for the selected brand. Test APKs can use a temporary key.
      - name: Signing key
        env:
          KS_B64: ${{ secrets[format('{0}ANDROID_KEYSTORE_BASE64', env.SIGNING_PREFIX)] }}
          KS_PASS: ${{ secrets[format('{0}KEYSTORE_PASSWORD', env.SIGNING_PREFIX)] }}
          KEY_ALIAS: ${{ secrets[format('{0}KEY_ALIAS', env.SIGNING_PREFIX)] }}
          KEY_PASS: ${{ secrets[format('{0}KEY_PASSWORD', env.SIGNING_PREFIX)] }}
        run: |
          umask 077
          if [ "$ARTIFACT" = aab ] && { [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; }; then
            echo "::error::Set all upload-key secrets for the selected brand."
            exit 1
          fi
          if [ -n "$KS_B64" ]; then
            echo "Using release keystore from secrets"
            echo "$KS_B64" | base64 -d > android/upload.jks
            ALIAS="$KEY_ALIAS"; SP="$KS_PASS"; KP="$KEY_PASS"
          else
            echo "No keystore secrets -> generating a throwaway key"
            ALIAS=erpapp; SP=erpapp123; KP=erpapp123
            keytool -genkeypair -v -keystore android/upload.jks -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$SP" -keypass "$KP" -dname "CN=KrishiDukan ERP"
          fi
          # build.gradle.kts resolves storeFile against the android/ folder.
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$SP"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KP"
          } > android/key.properties

      - run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test --flavor "$BRAND"

      - name: Build Android release
        run: |
          if [ "$ARTIFACT" = aab ]; then
            flutter build appbundle --release --flavor "$BRAND"
          else
            flutter build apk --release --flavor "$BRAND"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ format('{0}-erp-{1}', env.BRAND == 'karanarjun' && 'krishidukan' || env.BRAND, env.ARTIFACT) }}
          path: ${{ env.ARTIFACT == 'aab' && format('KARANARJUNKSKPVTLTD/krishidukan_erp_app/build/app/outputs/bundle/{0}Release/app-{0}-release.aab', env.BRAND) || format('KARANARJUNKSKPVTLTD/krishidukan_erp_app/build/app/outputs/flutter-apk/app-{0}-release.apk', env.BRAND) }}
          if-no-files-found: error
          retention-days: 30
